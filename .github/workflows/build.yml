name: Build

# Branches are checked through their pull request; only main is built on push
# (it releases). Draft pull requests are built once they are ready for review.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push supersedes the running build of the same branch; main is never
# cancelled, so that a release is not lost.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain pinned in rust-toolchain.toml, so that CI lints with the
      # same clippy as local builds and Claude Code sessions.
      - name: Read toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then echo 'no channel in rust-toolchain.toml' >&2; exit 1; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # A push to main releases the version in Cargo.toml as tag v<version>,
      # unless that tag already exists (a merge without a version bump).
      - name: Release version
        id: release
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then echo 'no version in Cargo.toml' >&2; exit 1; fi
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              echo "::notice::$tag already exists; no release"
            else
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Node.js and the OpenSpec CLI at the versions in mise.toml (the Rust
      # toolchain is set up above). No cache: a restored npm install loses its
      # links on Windows ("Cannot find package 'ora'"), and installing is quick.
      - uses: jdx/mise-action@v3
        with:
          install_args: node npm:@fission-ai/openspec
          cache: false

      - name: Validate specs
        shell: bash
        env:
          OPENSPEC_TELEMETRY: '0'
        run: openspec validate --all --strict

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      # Signs the exe with the self-signed certificate (assets/codesign.cer;
      # tools/make_codesign_cert.sh). Skipped without the secrets (forks), except
      # for a release, which must be signed.
      - name: Sign
        shell: pwsh
        env:
          CODESIGN_PFX: ${{ secrets.CODESIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if (-not $env:CODESIGN_PFX) {
            if ($env:RELEASE_TAG) { throw 'CODESIGN_PFX is not set' }
            Write-Output '::warning::CODESIGN_PFX is not set; the exe is not signed'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          try {
            & $signtool.FullName sign /f $pfx /p $env:CODESIGN_PASSWORD /fd sha256 `
              /tr http://timestamp.digicert.com /td sha256 /d 'Mind PKM' target/release/mind-pkm.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item $pfx
          }
          # The certificate is self-signed, so only check that a signature is there.
          $sig = Get-AuthenticodeSignature target/release/mind-pkm.exe
          if (-not $sig.SignerCertificate) { throw 'the exe has no signature' }
          Write-Output "Signed by $($sig.SignerCertificate.Subject) ($($sig.SignerCertificate.Thumbprint))"

      - uses: actions/upload-artifact@v4
        with:
          name: mind-pkm-windows-x64
          path: target/release/mind-pkm.exe
          retention-days: 3

      - name: Release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            target/release/mind-pkm.exe
            assets/codesign.cer
