[package]
name = "mind-pkm"
version = "0.12.0"
edition = "2024"
description = "A personal knowledge management system around a Freeplane-compatible mind map"
license = "MIT"
authors = ["unhurried"]

[dependencies]
iced = { version = "0.14", features = ["tokio", "advanced", "canvas", "image-without-codecs", "svg"] }
# The image formats the page editor shows (iced's own `image` feature would add every codec).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
latex-rust = "3.0"
mermaid-rs-renderer = { version = "0.3", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
arboard = "3.7"
emojis = "0.9"
htmd = "0.5"
unicode-width = "0.2"
unicode-segmentation = "1.13"
tantivy = "0.27"
lindera = { version = "6.2", features = ["embed-ipadic"] }
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }
pdf-extract = "0.12"
opener = "0.9"
rfd = "0.17"
trash = "5.2"
chrono = "0.4"
percent-encoding = "2"
dirs = "7"
fastrand = "2"
tokio = { version = "1", features = ["rt"] }
unicode-normalization = "0.1"
# PDF export prints from a temporary folder.
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
proptest = "1.12"

[profile.release]
strip = true
lto = "thin"
